name: 'snowflake_project'
profile: snowflake_project
version: '1.0.0'
config-version: 2

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Stamp annex1 with a load time so `dbt source freshness` can check the daily 13:00 refresh.
# In production, set _loaded_at in the upstream ETL instead of this seed post-hook.
seeds:
  snowflake_project:
    annex1:
      +post-hook:
        - "alter table {{ this }} add column if not exists _loaded_at timestamp_ntz"
        - "update {{ this }} set _loaded_at = current_timestamp()"
